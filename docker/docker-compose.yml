name: zhimesh

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: zhimesh-api:${IMAGE_VERSION:-local}
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_PROFILE: ${APP_PROFILE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1536m -XX:+HeapDumpOnOutOfMemoryError}
      ZHIMESH_DB_HOST: ${ZHIMESH_DB_HOST}
      ZHIMESH_DB_PORT: ${ZHIMESH_DB_PORT:-5432}
      ZHIMESH_DB_NAME: ${ZHIMESH_DB_NAME:-zhimesh}
      ZHIMESH_DB_USERNAME: ${ZHIMESH_DB_USERNAME}
      ZHIMESH_DB_PASSWORD: ${ZHIMESH_DB_PASSWORD}
      ZHIMESH_REDIS_HOST: redis
      ZHIMESH_REDIS_PORT: 6379
      ZHIMESH_REDIS_PASSWORD: ""
      ZHIMESH_MAIL_HOST: ${ZHIMESH_MAIL_HOST:-}
      ZHIMESH_MAIL_USERNAME: ${ZHIMESH_MAIL_USERNAME:-}
      ZHIMESH_MAIL_PASSWORD: ${ZHIMESH_MAIL_PASSWORD:-}
      ZHIMESH_ENCRYPT_AES_KEY: ${ZHIMESH_ENCRYPT_AES_KEY}
      ZHIMESH_LOCAL_BASE_DATA_PATH: /data/zhimesh
      ZHIMESH_HOST: ${ZHIMESH_HOST:-localhost}
      ZHIMESH_FRONTEND_URL: ${ZHIMESH_FRONTEND_URL:-http://localhost}
      ZHIMESH_BACKEND_URL: ${ZHIMESH_BACKEND_URL:-http://localhost/api}
      ZHIMESH_CONVERSATION_ENABLED: ${ZHIMESH_CONVERSATION_ENABLED:-true}
      ZHIMESH_CONVERSATION_AUTO_CREATE_DEFAULT: ${ZHIMESH_CONVERSATION_AUTO_CREATE_DEFAULT:-false}
      ZHIMESH_SHORT_MEMORY_TTL: ${ZHIMESH_SHORT_MEMORY_TTL:-0s}
      ZHIMESH_SHORT_MEMORY_MAX_VALUE_BYTES: ${ZHIMESH_SHORT_MEMORY_MAX_VALUE_BYTES:-1048576}
      ZHIMESH_SHORT_MEMORY_TURN_LOCK_WAIT: ${ZHIMESH_SHORT_MEMORY_TURN_LOCK_WAIT:-2s}
      ZHIMESH_SHORT_MEMORY_TURN_LOCK_LEASE: ${ZHIMESH_SHORT_MEMORY_TURN_LOCK_LEASE:-30s}
      ZHIMESH_EMBEDDING_MODEL: ${ZHIMESH_EMBEDDING_MODEL:-local:bge-small-zh-v1.5}
      ZHIMESH_VECTOR_DATABASE: ${ZHIMESH_VECTOR_DATABASE:-pgvector}
      ZHIMESH_GRAPH_DATABASE: ${ZHIMESH_GRAPH_DATABASE:-apache-age}
      ZHIMESH_CANONICAL_CHUNK_ENABLED: ${ZHIMESH_CANONICAL_CHUNK_ENABLED:-true}
      ZHIMESH_BM25_ENABLED: ${ZHIMESH_BM25_ENABLED:-true}
      ZHIMESH_BM25_AUTO_INDEX: ${ZHIMESH_BM25_AUTO_INDEX:-true}
      ZHIMESH_BM25_TIMEOUT_MS: ${ZHIMESH_BM25_TIMEOUT_MS:-5000}
      ZHIMESH_BM25_TOP_K: ${ZHIMESH_BM25_TOP_K:-5}
      ZHIMESH_BM25_K1: ${ZHIMESH_BM25_K1:-1.2}
      ZHIMESH_BM25_B: ${ZHIMESH_BM25_B:-0.75}
      ZHIMESH_BM25_MAX_QUERY_TERMS: ${ZHIMESH_BM25_MAX_QUERY_TERMS:-128}
      ZHIMESH_BM25_ANALYZER_VERSION: ${ZHIMESH_BM25_ANALYZER_VERSION:-cjk-bigram-trigram-ident-v1}
      ZHIMESH_NEO4J_HOST: ${ZHIMESH_NEO4J_HOST:-host.docker.internal}
      ZHIMESH_NEO4J_PORT: ${ZHIMESH_NEO4J_PORT:-7687}
      ZHIMESH_NEO4J_USERNAME: ${ZHIMESH_NEO4J_USERNAME:-}
      ZHIMESH_NEO4J_PASSWORD: ${ZHIMESH_NEO4J_PASSWORD:-}
      ZHIMESH_NEO4J_DATABASE: ${ZHIMESH_NEO4J_DATABASE:-neo4j}
    volumes:
      - app-data:/data/zhimesh
      - app-logs:/data/zhimesh-logs
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9999"

  user-web:
    image: zhimesh-user-web:${IMAGE_VERSION:-local}
    build:
      context: ../user-web
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  admin-web:
    image: zhimesh-admin-web:${IMAGE_VERSION:-local}
    build:
      context: ../admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - user-web
      - admin-web

volumes:
  redis-data:
  app-data:
  app-logs:
