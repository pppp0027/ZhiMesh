server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 外壳必须每次重新验证（ETag 命中返回 304）：否则浏览器对无缓存头的
    # index.html 走启发式缓存，发版后仍引用已被删除的旧 hash 资源而 404
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物带内容 hash，永不变化，可长缓存且免重新验证；
    # ^~ 让本前缀块优先于下方的静态资源正则块
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
