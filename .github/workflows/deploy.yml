name: deploy

# 发版流水线：push 到云端 main 分支（任意本地分支推送到远端 main 均可触发）
# 或在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一时间只允许一条发版流水线，后来的排队等待，避免交叉部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 阶段一：后端单元测试（纯单测，不依赖外部数据库/Redis）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: server
        run: mvn -B -ntp test

  # 阶段二：构建三个镜像并推送到镜像仓库
  # 在自建 runner（腾讯云服务器）上执行：构建与推镜像全部国内完成，彻底
  # 绕开美国 runner 推 TCR 的跨境链路。api 使用多阶段 Dockerfile 在 Docker
  # 内构建 Maven——宿主机 docker 驱动下 --mount=type=cache 的依赖缓存与
  # 层缓存持久保存在 /var/lib/docker，跨次构建复用（ephemeral GitHub
  # runner 做不到这点，当时才引入 Dockerfile.ci 方案，保留作回退路径）。
  build-push:
    needs: test
    runs-on: [self-hosted]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./server
          - name: user-web
            context: ./user-web
          - name: admin-web
            context: ./admin-web
    steps:
      - uses: actions/checkout@v4

      # 用宿主机 docker daemon 构建（driver: docker）：基础镜像走宿主机的
      # registry 加速拉取——buildkit 容器（docker-container 驱动）直连
      # docker.io 会 i/o timeout
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      # 国内→国内登录 TCR，保留重试兜底
      - name: Login to registry (with retry)
        timeout-minutes: 10
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin; then
              echo "registry login ok (attempt $attempt)"
              exit 0
            fi
            echo "registry login attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "registry login failed after 3 attempts"
          exit 1

      - uses: docker/build-push-action@v6
        timeout-minutes: 60
        with:
          context: ${{ matrix.context }}
          push: true
          # docker 驱动不支持 attestation，显式关闭
          provenance: false
          tags: |
            ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}/zhimesh-${{ matrix.name }}:latest
            ${{ secrets.REGISTRY }}/${{ secrets.REGISTRY_NAMESPACE }}/zhimesh-${{ matrix.name }}:sha-${{ github.sha }}

  # 阶段三：拉取新镜像并滚动更新容器（runner 就在部署机上，直接本机执行）
  deploy:
    needs: build-push
    runs-on: [self-hosted]
    steps:
      - name: Deploy containers
        run: |
          set -e
          cd /opt/zhimesh

          # 首次运行守卫：服务器尚未放置 compose/.env 时跳过部署（只完成镜像推送）
          if [ ! -f docker-compose.yml ]; then
            echo "deploy: /opt/zhimesh/docker-compose.yml 未安装，跳过部署（仅完成镜像构建推送）"
            exit 0
          fi

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          sleep 12
          docker compose ps

          # 健康检查：任意 HTTP 状态码都算服务存活（000 = 连不上才算失败）
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:9999/ || echo 000)
          if [ "$code" = "000" ]; then
            echo "deploy: API 健康检查失败（:9999 无 HTTP 响应）"
            docker compose logs --tail=80 api
            exit 1
          fi
          echo "deploy: API 已启动（HTTP $code）"
